spring.application.name=arc-backend
spring.profiles.active=h2

# Server Configuration
server.port=8080

# Local PostgreSQL Database Configuration (PostgreSQL 17)
spring.datasource.url=jdbc:postgresql://localhost:5432/arc_Database
spring.datasource.username=postgres
spring.datasource.password=2179
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# H2 Console (enabled for quick DB viewing if using H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS Origins
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080

# Embossing Simulation Timing (milliseconds)
embossing.simulation.in-machine-delay-ms=2000
embossing.simulation.printing-delay-ms=5000
embossing.simulation.active-batch=Batch_1
embossing.simulation.dummy-job-count=5

# JWT Authentication
jwt.secret=arc-manufacturing-jwt-secret-key-change-in-production-min-256-bits
jwt.expiration-ms=86400000

