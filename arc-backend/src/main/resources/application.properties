spring.application.name=arc-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/arc_Database
spring.datasource.username=postgres
spring.datasource.password=roopa1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=8080

# Embossing simulation timing (milliseconds)
embossing.simulation.in-machine-delay-ms=2000
embossing.simulation.printing-delay-ms=5000
embossing.simulation.active-batch=Batch_1
embossing.simulation.dummy-job-count=5

# JWT (placeholder for future auth integration)
jwt.secret=arc-manufacturing-jwt-secret-key-change-in-production-min-256-bits
jwt.expiration-ms=86400000
