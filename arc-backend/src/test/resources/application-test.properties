spring.datasource.url=jdbc:h2:mem:arc_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

jwt.secret=arc-manufacturing-jwt-secret-key-change-in-production-min-256-bits
jwt.expiration-ms=86400000

embossing.simulation.in-machine-delay-ms=10
embossing.simulation.printing-delay-ms=10
embossing.simulation.active-batch=Batch_1
embossing.simulation.dummy-job-count=5
