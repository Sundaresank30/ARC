server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/arc_database
spring.datasource.username=postgres
spring.datasource.password=2179
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=arc-manufacturing-jwt-secret-key-change-in-production-min-256-bits
jwt.expiration-ms=86400000

# Embossing Simulation Configuration
embossing.simulation.in-machine-delay-ms=10
embossing.simulation.printing-delay-ms=10
embossing.simulation.active-batch=Batch_1
embossing.simulation.dummy-job-count=5
